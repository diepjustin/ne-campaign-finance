name: NE Campaign Finance daily download

on:
  schedule:
    # Both fire every day; the gate step below lets through only the entry
    # matching the current UTC offset, so exactly one does anything on any
    # given day. Two entries exist because GitHub Actions cron is UTC-only
    # with no DST awareness -- see ne-contracts' daily.yml for the incident
    # that made gating on the fired cron entry (not the wall clock) the rule.
    - cron: '0 9 * * *'   # 4am Central during CDT (UTC-5, 09:00 UTC)
    - cron: '0 10 * * *'  # 4am Central during CST (UTC-6, 10:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write  # for `gh release create` below (data-release publish for ne-connect)
  actions: write   # for `gh cache delete` cleanup

concurrency:
  group: ne-campaign-finance-daily
  cancel-in-progress: false   # never cancel a run that might be mid-write to data/

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pick the DST-correct cron entry
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          case "$offset" in
            -0500) want='0 9 * * *' ;;   # CDT
            -0600) want='0 10 * * *' ;;  # CST
            *)     want='' ;;
          esac

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            proceed=true
          elif [ -n "$want" ] && [ "$SCHEDULE" = "$want" ]; then
            proceed=true
          else
            proceed=false
            echo "Central offset is $offset, so today's real run is cron '$want'; this run came from '$SCHEDULE'. Skipping."
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "Central offset $offset -> proceed=$proceed"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Pure-function tests over the parsers and schemas, no network and no
      # data/ -- a broken parser should stop the run before it fetches anything.
      - name: Tests
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -m pytest tests/ -q

      # Unlike ne-contracts (an hours-long scrape whose baseline is worth
      # protecting with fail-on-cache-miss), a full download_extracts.py run
      # here is minutes -- so a cache miss just redownloads instead of
      # failing the job. Restoring on a hit still saves most runs from
      # re-fetching data the state hasn't changed (download_extracts.py
      # skips a year already pulled today).
      - name: Restore data/ cache
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: data
          key: ne-campaign-finance-data-${{ github.run_id }}
          restore-keys: |
            ne-campaign-finance-data-

      - name: Download extracts (validates and guards against a shrink)
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/download_extracts.py

      - name: Normalize
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/normalize.py

      # The legacy zip is frozen by the state (see download_legacy.py's own
      # sha256 check) -- this step is cheap every night: one GET, a sha
      # compare, and extraction only runs again if that sha ever changes.
      - name: Download legacy (sha-checked, skips extraction if unchanged)
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/download_legacy.py

      - name: Normalize legacy
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/normalize_legacy.py

      - name: Build the search page
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/build_site.py

      # scrape_c1.py is deliberately NOT run here yet. It has no --new-only /
      # incremental mode -- every run today re-sweeps the search grid from
      # scratch, and a live financial-disclosure site is not something to
      # put on an unbounded nightly cron without that dedup logic designed
      # and the cadence decided first. See PLAN.md 1.6.

      - name: Check data/ is worth caching
        id: cachecheck
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          if ls data/processed/*.csv >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            du -sh data
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data/processed holds no CSVs -- skipping the cache save so the existing good cache stays the newest match."
          fi

      - name: Save data/ cache
        if: always() && steps.cachecheck.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: data
          key: ne-campaign-finance-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete old data/ cache entries (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key ne-campaign-finance-data- --json id,createdAt --limit 100 \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].id' \
            | xargs -r -n1 gh cache delete

      # ne-connect (the hub) can't read this repo's gitignored data/processed/
      # directly, and Actions caches are strictly repo-scoped -- a release is
      # the one thing that crosses that boundary (ne-lobbying's own monthly
      # backup already does this, PLAN.md 0.5). ne-connect-nightly.yml
      # downloads the latest ne-campaign-finance-data-* release. Warn rather
      # than fail: a missed release here should never take down a download
      # that already succeeded at its real job.
      - name: Publish a data release for ne-connect
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for f in data/processed/*.csv; do
            [ -f "$f" ] && gzip -c "$f" > "release/$(basename "$f").gz"
          done
          if ls release/*.gz >/dev/null 2>&1; then
            tag="ne-campaign-finance-data-$(TZ=America/Chicago date +%Y-%m-%d)"
            # Same-day re-run would otherwise hit "a release with the same
            # tag name already exists" and silently keep serving the first
            # run's stale data -- confirmed happening for real in ne-fec's
            # identical pattern on 2026-09-19 -- delete any existing
            # same-day release first so a re-run actually replaces it.
            gh release delete "$tag" --repo diepjustin/ne-campaign-finance --yes 2>/dev/null || true
            gh release create "$tag" release/*.gz \
              --repo diepjustin/ne-campaign-finance \
              --title "Campaign finance hub data — $(TZ=America/Chicago date +%Y-%m-%d)" \
              --notes "Automated data export for ne-connect-nightly.yml. See ne-connect's PLAN.md." \
              || echo "::warning::gh release create failed -- ne-connect will build from its previous release tonight"
          else
            echo "::warning::nothing to release -- skipping"
          fi

      - name: Delete old hub-data releases (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo diepjustin/ne-campaign-finance --json tagName,createdAt --limit 100 \
            | jq -r '[.[] | select(.tagName | startswith("ne-campaign-finance-data-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 -I{} gh release delete {} --repo diepjustin/ne-campaign-finance --yes
